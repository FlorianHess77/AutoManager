<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121417">
<meta name="mobile-web-app-capable" content="yes">
<title>Garage</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#121417;--surface:#1b1e23;--surface2:#252931;--line:#30353e;--text:#eceff3;--muted:#99a2ae;--accent:#f5a524;--on-accent:#1b1300;--red:#ef5350;--yellow:#f2c230;--green:#4caf7a;--radius:14px;color-scheme:dark}
:root[data-theme=light]{--bg:#f2f3f5;--surface:#fff;--surface2:#eceef2;--line:#d6dae0;--text:#15181c;--muted:#5b6470;--accent:#d98a00;--on-accent:#fff;--red:#d32f2f;--yellow:#b88a00;--green:#2e8b57;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
body.noscroll{overflow:hidden}
a{color:var(--accent)}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));border-bottom:1px solid var(--line)}
header.top h1{font-size:20px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{min-width:44px;height:44px;border-radius:12px;border:0;background:var(--surface2);color:var(--text);display:inline-grid;place-items:center;font-size:19px;padding:0 10px;cursor:pointer}
.iconbtn.sm{min-width:36px;height:36px;font-size:16px}
main{padding:16px 16px 96px;max-width:760px;margin:0 auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;display:grid;grid-template-columns:repeat(var(--nt,5),1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{background:none;border:0;color:var(--muted);height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-family:inherit;cursor:pointer}
nav.tabs button.on{color:var(--accent);font-weight:700}
nav svg,.ico{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fab{position:fixed;right:16px;bottom:calc(80px + env(safe-area-inset-bottom));width:64px;height:64px;border-radius:20px;border:0;background:var(--accent);color:var(--on-accent);font-size:36px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.35);z-index:7;cursor:pointer}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:24px 0 10px}
h4{margin:20px 0 8px;font-size:15px}
.muted{color:var(--muted)} .sub{color:var(--muted);font-size:14px}
.pre{white-space:pre-wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:8px;min-height:58px;cursor:pointer}
.item.col{flex-direction:column;align-items:stretch;gap:6px}
.item.done b{text-decoration:line-through;color:var(--muted)}
.grow{flex:1;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grid3 .btn{padding:0 8px;white-space:nowrap}
.btn{min-height:48px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--text);font-weight:600;font-size:16px;line-height:1.1;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--red)}
.btn.block{width:100%;margin-bottom:8px}
.btn.grow{flex:1}
.linkbtn{background:none;border:0;color:var(--accent);font:inherit;font-weight:700;padding:0;cursor:pointer}
label.f{display:block;margin-bottom:10px;min-width:0}
label.f>span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;min-height:48px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--text);font:inherit;font-size:16px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0}
textarea{min-height:84px;resize:vertical}
input[type=checkbox],input[type=radio]{width:auto;min-height:0}
.checkline{display:flex;gap:12px;align-items:center;min-height:48px;cursor:pointer}
.checkline input{width:24px;height:24px;accent-color:var(--accent);flex:none}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:4px;gap:4px;margin-bottom:10px}
.seg label{flex:1;position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:9px;font-weight:600;color:var(--muted);text-align:center;padding:0 6px}
.seg input:checked+span{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface2);color:var(--muted);white-space:nowrap}
.st-over{--st:var(--red)} .st-soon{--st:var(--yellow)} .st-ok{--st:var(--green)} .st-unknown{--st:var(--muted)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--st);flex:none}
.badge.st{background:color-mix(in srgb,var(--st) 18%,transparent);color:var(--st)}
.item.st-over{border-left:5px solid var(--red)} .item.st-soon{border-left:5px solid var(--yellow)}
.bar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--st,var(--accent))}
.note{background:var(--surface2);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.note.warn{border-left:4px solid var(--yellow)}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:15px;font-family:inherit;cursor:pointer}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer}
.ph{aspect-ratio:16/9;background:var(--surface2);display:grid;place-items:center;color:var(--muted);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.ph svg{width:84px;height:84px;opacity:.5}
.ph.nophoto{aspect-ratio:auto;height:76px}
.ph.stretch{touch-action:pan-y}.ph.stretch.anim{transition:height .28s cubic-bezier(.2,.8,.2,1)}.sheet-panel{overscroll-behavior-y:contain}
.ph.nophoto svg{width:52px;height:52px}
.tile .body{padding:12px 14px}
.tile .t{font-size:18px}
.due{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px}
.plate{display:inline-block;background:#fff;color:#111;border:1px solid #999;border-top:3px solid #c8102e;border-bottom:3px solid #c8102e;border-left:8px solid #039;border-radius:3px;padding:0 6px;font-weight:800;font-size:13px;letter-spacing:.05em;white-space:nowrap}
.cat{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c);flex:none}
.amt{font-weight:700;white-space:nowrap}
.kv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 16px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;word-break:break-word}
.big{font-size:28px;font-weight:800}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qbtn{min-height:96px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-weight:600;font-size:15px;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.qbtn b{font-size:28px}
.prow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px 2px;margin-bottom:10px}
.prow-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.srow{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-bottom:6px;align-items:center}
.total{display:flex;justify-content:space-between;font-size:18px;padding:12px 0;border-top:1px solid var(--line);margin-top:6px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-bottom:10px}
.thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--surface2)}
.thumb img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.thumb .tag{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.7);color:#fff;border:0;border-radius:6px;font-size:12px;padding:3px 7px;font-family:inherit}
.thumb .x{position:absolute;right:4px;top:4px;background:rgba(0,0,0,.7);color:#fff;border:0;border-radius:8px;width:30px;height:30px}
.chk{width:34px;height:34px;border-radius:10px;border:2px solid var(--muted);flex:none;display:grid;place-items:center;background:none;color:transparent;font-size:18px;font-weight:900;cursor:pointer}
.chk.on{background:var(--green);border-color:var(--green);color:#fff}
.qty{display:flex;align-items:center;gap:6px;flex:none}
.qty span{min-width:62px;text-align:center;font-weight:700;font-size:14px}
.item.empty-stock{opacity:.6}
.bars .barrow{margin-bottom:10px}
.bars .barrow .row{margin-bottom:4px;font-size:14px}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet.hidden,#lightbox.hidden{display:none}
.sheet-panel{background:var(--bg);width:100%;max-width:760px;max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;padding:0 16px calc(16px + env(safe-area-inset-bottom))}
.sheet-head{touch-action:none;position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:8px;padding:14px 0;z-index:2;border-bottom:1px solid var(--line);margin-bottom:12px}
.sheet-head::before{content:'';position:absolute;top:5px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--line)}
.sheet-head h3{flex:1;margin:0;font-size:18px}
.sheet-foot{position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom));background:var(--bg);padding:12px 0 calc(16px + env(safe-area-inset-bottom));margin-bottom:calc(-16px - env(safe-area-inset-bottom));display:flex;gap:8px;border-top:1px solid var(--line);margin-top:12px}
#lightbox{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.92);display:grid;place-items:center}
#lightbox img{max-width:100%;max-height:100%}
#toast{position:fixed;left:16px;right:16px;top:calc(68px + env(safe-area-inset-top));z-index:50;background:#2c313a;color:#fff;border-radius:12px;padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;transform:translateY(-12px);opacity:0;pointer-events:none;transition:.2s;box-shadow:0 6px 20px rgba(0,0,0,.4);max-width:600px;margin:0 auto}
#toast.show{transform:none;opacity:1;pointer-events:auto}
#toast .tbtn{background:none;border:0;color:var(--accent);font-weight:800;font-size:15px;min-height:40px;font-family:inherit}
#print{display:none}
.thumb-pdf{display:grid;place-items:center;cursor:pointer;border:1px solid var(--line)}
.pdf-ic{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--accent);text-align:center;padding:6px 6px 22px}
.pdf-ic b{font-size:12px}.pdf-ic small{font-size:10px;color:var(--muted);max-width:86px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scanbig{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;border-radius:14px;border:2px dashed color-mix(in srgb,var(--accent) 60%,transparent);background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--accent);font-weight:800;font-size:16px;cursor:pointer;margin-bottom:10px}
.scanbig .ico{width:24px;height:24px}
#ocrState{background:var(--surface2);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.ocr-bar{height:6px;background:var(--surface);border-radius:3px;overflow:hidden;margin-bottom:6px}.ocr-bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
input.ocr-hit,select.ocr-hit{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}
.ico.s{width:15px;height:15px}.ico.ci{width:21px;height:21px}
.cat .ico{color:var(--c)}
.cbar{width:4px;align-self:stretch;min-height:30px;border-radius:3px;flex:none;margin:-2px 0}
.ctag{display:inline-block;font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:6px;line-height:1.5;vertical-align:1px;white-space:nowrap}
.cdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
.ccard{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--cc);border-radius:16px;padding:10px;margin-bottom:10px;cursor:pointer}
.ccard img,.ccard-ph{width:100px;height:78px;object-fit:cover;border-radius:11px;flex:none;background:var(--surface2);display:grid;place-items:center;color:var(--muted)}
.ccard b{font-size:17px}.ccard .km{font-size:13px;color:var(--muted);margin:1px 0 7px}
.pills{display:flex;flex-wrap:wrap;gap:5px}
.pill{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}.pill.wa{background:color-mix(in srgb,var(--yellow) 16%,transparent);color:var(--yellow)}.pill.ba{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
h2 .h2a{color:var(--accent);text-transform:none;letter-spacing:0;font-weight:700;background:none;border:0;font:inherit;font-size:13px;cursor:pointer;float:right}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mtile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:600;text-align:center;cursor:pointer;color:var(--text)}
#navcfg{scroll-margin-top:80px}.navcfg .item{cursor:default}.navcfg .item.off .cat,.navcfg .item.off .grow{opacity:.6}.navcfg .item.off .btn.primary{background:transparent;color:var(--accent);border:1px solid var(--accent)}.navcfg .mv{display:flex;gap:4px}.navcfg .iconbtn{width:40px;height:40px}
.ctabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface2);border-radius:16px;padding:4px;margin-bottom:10px}
.ctabs button{background:none;border:0;color:var(--muted);font:inherit;font-size:12.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;border-radius:12px;cursor:pointer;min-height:56px;justify-content:center}
.ctabs button .ico{width:22px;height:22px}.ctabs button.on{background:var(--accent);color:var(--on)}
.cdotr{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);vertical-align:2px}
.seg2{display:flex;gap:6px;margin-bottom:12px}.seg2 button{flex:1;background:none;border:1px solid var(--line);color:var(--muted);font:inherit;font-size:14px;font-weight:600;padding:9px 4px;border-radius:12px;cursor:pointer}.seg2 button.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
details.fold{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:8px;padding:0 14px}
details.fold>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0;cursor:pointer;min-height:52px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary span{margin-left:auto;color:var(--muted);font-size:13.5px;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.fold>summary::after{content:'›';color:var(--muted);font-size:20px;transition:transform .2s;flex:none}
details.fold[open]>summary::after{transform:rotate(90deg)}
details.fold[open]{padding-bottom:12px}details.fold .kv{margin-bottom:10px}
.morebtn{display:block;width:100%;background:none;border:0;color:var(--accent);font:inherit;font-weight:700;font-size:14.5px;padding:10px;cursor:pointer}
.h2n{color:var(--muted);font-weight:700}
.mlist{display:flex;flex-direction:column}.mitem{display:flex;align-items:center;gap:14px;background:none;border:0;border-bottom:1px solid var(--line);color:var(--text);font:inherit;font-size:16px;font-weight:600;padding:15px 4px;text-align:left;cursor:pointer}
.mitem:last-child{border-bottom:0}.mitem span{width:26px;text-align:center;font-size:18px}.mitem.red{color:var(--red)}
.hchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.hchip{background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.hchip.g{border-color:color-mix(in srgb,var(--green) 45%,transparent);color:var(--green)}.hchip.y{border-color:color-mix(in srgb,var(--yellow) 45%,transparent);color:var(--yellow)}
.searchbar{display:flex;align-items:center;gap:10px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--muted);font:inherit;font-size:15px;margin-bottom:6px;cursor:pointer;text-align:left}
.mtile .mi{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,transparent)}
.mtile .mi .ico{width:25px;height:25px}.mtile small{color:var(--muted);font-weight:500;font-size:11px;margin-top:-4px}
.qbtn .ico{width:28px;height:28px;color:var(--accent)}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 8px;margin-bottom:12px}
.chart-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.legend{display:flex;align-items:center;gap:5px;text-transform:none;letter-spacing:0;font-weight:600;flex-wrap:wrap;justify-content:flex-end}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-left:6px}.legend i.dash{width:14px;height:0;border-top:2px dashed var(--muted);border-radius:0}
.plot{position:relative;height:110px;margin-left:30px}
.yax span{position:absolute;left:-32px;width:26px;text-align:right;font-size:10px;color:var(--muted);opacity:.75;transform:translateY(50%)}
.grid-l i{position:absolute;left:0;right:0;border-top:1px solid var(--line);opacity:.6}
.cols{position:absolute;inset:0;display:flex;gap:8px;align-items:flex-end}
.col{flex:1;height:100%;display:flex;gap:2px;align-items:flex-end;justify-content:center}
.col i{flex:1;max-width:18px;border-radius:4px 4px 0 0;min-height:0}
.lsvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.xax{display:flex;gap:8px;margin:5px 0 0 30px;font-size:10px;color:var(--muted)}.xax span{flex:1;text-align:center}
.swatches{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 6px}
.sw{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0;display:grid;place-items:center;position:relative;color:#fff}
.sw.on{outline:3px solid var(--text);outline-offset:2px}
.sw-custom input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;min-height:0}
header.top.with-tabs h1{flex:none}
header.top.with-tabs #hdrActions{flex:1;min-width:0;display:flex;justify-content:flex-end}
.hdr-seg{display:flex;gap:3px;background:var(--surface2);border-radius:12px;padding:3px;width:100%;max-width:300px}
.hdr-seg button{flex:1;min-height:40px;border:0;border-radius:9px;background:none;color:var(--muted);font:inherit;font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap;padding:0 6px}
.hdr-seg button.on{background:var(--accent);color:var(--on-accent)}

 if(t>we){st='over';text=`Toleranz seit ${fmtD(we)} abgelaufen!`}else if(t>=ws){st='soon';text=`jetzt möglich – spätestens bis ${fmtD(we)}`}

function viewHelp(){return{title:'Installation & Hilfe',tab:'more',back:'#/more',html:`<div class="card"><b>Auf Android installieren</b><ol style="padding-left:20px;margin:8px 0">
<li>Den App-Ordner (index.html, sw.js, manifest.webmanifest, Icons) bei einem kostenlosen Webhoster hochladen, z. B. GitHub Pages, Netlify oder Cloudflare Pages.</li>
<li>Die Adresse einmal in <b>Chrome</b> auf dem Handy öffnen.</li><li>Menü ⋮ → <b>App installieren</b> bzw. <b>Zum Startbildschirm hinzufügen</b>.</li>
<li>Fertig – ab jetzt startet sie vom Homescreen und läuft komplett offline.</li></ol>
<p class="sub">Die Daten werden nicht hochgeladen. Sie bleiben im Speicher dieser App auf deinem Handy.</p></div>
<div class="card"><b>Tipps</b><ul style="padding-left:20px;margin:8px 0">
<li>Beim Speichern eines Eintrags passende Intervalle anhaken – dann springt die Fälligkeit automatisch weiter.</li>
<li>Ein erledigtes To-do lässt sich mit „→ Eintrag“ direkt in die Historie übernehmen, inklusive Teile.</li>
<li>„Kopieren“ in einem Eintrag spart Tipparbeit beim nächsten Ölwechsel.</li>
<li>In der Historie nach „Bremsflüssigkeit“ suchen zeigt sofort, wann es zuletzt war.</li>
<li>Teile, die du aus dem Lager nimmst, werden automatisch abgebucht – auch in anderen Einheiten (z. B. 500 ml aus einem Lager in Litern).</li>
<li>Lager: Preis so eintragen wie bezahlt (z. B. 12 € für 250 g). Barcode scannen mit 📷 – der Code wird dem Artikel zugeordnet.</li>
<li>Einkaufsliste: oben eintippen und „+“ – abhaken, wenn gekauft. Gekauftes lässt sich direkt ins Lager buchen.</li>
<li>Werkzeug: Rechnung als Foto oder PDF und „Garantie bis“ hinterlegen – unter Mehr › Garantien siehst du alles auf einen Blick.</li>
<li>Tanken: „Tankbeleg fotografieren“ liest Liter, Literpreis, Betrag, Sorte, Datum und Tankstelle – du ergänzt nur den km-Stand. Unter Statistik siehst du die Spritpreise für Benzin und Diesel.</li>
<li>Dokumente pro Auto (Kaufvertrag, Zulassungsschein, Versicherung …) findest du in der Übersicht des Autos. Beim Verkauf kannst du den Verkaufsvertrag gleich mit fotografieren.</li>
<li>Fremde Autos (Freunde, Familie) legst du unter Garage › Fremde Autos an. Sie erscheinen nicht auf der Startseite, im Verlauf nur, wenn du sie auswählst, und in der Statistik getrennt.</li>
<li>Versehentlich gelöscht? Unten erscheint 10 Sekunden lang „Rückgängig“.</li>
<li>Beim Tippen eines Teilenamens erscheinen alle bereits verwendeten Artikel mit Hersteller, Nummer, Spezifikation und letztem Preis – antippen füllt alles aus.</li>
<li>Eigene Wartungsintervalle für jedes Bauteil oder jede Flüssigkeit: Auto › Intervalle › „+ Eigenes Bauteil“.</li>
<li>Das Pickerl wird aus der Erstzulassung berechnet. Nach der Begutachtung einen Eintrag mit Kategorie „Pickerl“ anlegen – dann springt es aufs nächste Jahr.</li>
<li>Verkaufte Autos landen im Archiv unter Mehr › Archiv, inklusive Bilanz aus Kauf, Verkauf und allen Kosten.</li>
<li>Werkstatt › Werkzeug: Kaufpreis eintragen und das Werkzeug bei Wartungen auswählen – die App rechnet Kosten pro Einsatz und ab wann es sich bezahlt macht.</li>
<li>Reifen: Sätze mit DOT und Profiltiefe anlegen, mit „Montieren“ wechseln – die km werden automatisch mitgezählt.</li>
<li>🔩 oben im Auto öffnet den Drehmoment-Spickzettel – groß lesbar, auch mit öligen Fingern.</li>
<li>QR-Aufkleber (Auto › Übersicht) in den Motorraum kleben – Scannen öffnet direkt das Auto.</li>
<li>„Backup teilen“ schickt die Sicherung direkt an Google Drive oder per Mail.</li></ul></div>`}}

const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src});
async function rotateData(src){const i=await loadImg(src);const c=document.createElement('canvas');c.width=i.height;c.height=i.width;const x=c.getContext('2d');x.translate(c.width/2,c.height/2);x.rotate(Math.PI/2);x.drawImage(i,-i.width/2,-i.height/2);return c.toDataURL('image/jpeg',.92)}
function openCropper(src,aspect=16/9){return new Promise(resolve=>{const ov=$('#cropper');ov.classList.remove('hidden');
 ov.innerHTML=`<div class="crop-head"><button type="button" class="btn" data-x="cancel">Abbrechen</button><b>Zuschneiden</b><button type="button" class="btn primary" data-x="ok">Fertig</button></div>
 <div class="crop-stage"><img alt="" draggable="false"><div class="crop-frame"></div></div>
 <div class="crop-tools"><button type="button" class="iconbtn" data-x="rot" aria-label="Drehen">⟳</button><input type="range" min="1" max="5" step="0.01" value="1" aria-label="Zoom"><button type="button" class="iconbtn" data-x="reset" aria-label="Zurücksetzen">↺</button></div>
 <p class="sub">Bild ziehen zum Verschieben · zwei Finger oder Regler zum Zoomen · ⟳ dreht</p>`;
 const stage=$('.crop-stage',ov),im=$('img',ov),frame=$('.crop-frame',ov),range=$('input',ov);
 let img,W=1,H=1,fw=1,fh=1,fx=0,fy=0,s0=1,z=1,x=0,y=0;
 const layout=()=>{const sw=stage.clientWidth,sh=stage.clientHeight;fw=Math.min(sw-32,(sh-32)*aspect);fh=fw/aspect;fx=(sw-fw)/2;fy=(sh-fh)/2;Object.assign(frame.style,{left:fx+'px',top:fy+'px',width:fw+'px',height:fh+'px'});s0=Math.max(fw/W,fh/H)};
 const draw=()=>{const sc=s0*z,mx=Math.max(0,(W*sc-fw)/2),my=Math.max(0,(H*sc-fh)/2);x=Math.max(-mx,Math.min(mx,x));y=Math.max(-my,Math.min(my,y));
  Object.assign(im.style,{width:W*sc+'px',height:H*sc+'px',left:(fx+fw/2-W*sc/2+x)+'px',top:(fy+fh/2-H*sc/2+y)+'px'})};
 const load=async s=>{img=await loadImg(s);src=s;W=img.width;H=img.height;im.src=s;layout();z=1;x=0;y=0;range.value=1;draw()};
 const pts=new Map();let d0=0,z0=1;
 stage.onpointerdown=e=>{stage.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===2){const[a,b]=[...pts.values()];d0=Math.hypot(a.x-b.x,a.y-b.y);z0=z}};
 stage.onpointermove=e=>{const p=pts.get(e.pointerId);if(!p)return;if(pts.size===1){x+=e.clientX-p.x;y+=e.clientY-p.y}pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2&&d0){const[a,b]=[...pts.values()];z=Math.max(1,Math.min(5,z0*Math.hypot(a.x-b.x,a.y-b.y)/d0));range.value=z}draw()};
 const up=e=>{pts.delete(e.pointerId);if(pts.size<2)d0=0};stage.onpointerup=up;stage.onpointercancel=up;
 stage.onwheel=e=>{e.preventDefault();z=Math.max(1,Math.min(5,z*(e.deltaY<0?1.1:.9)));range.value=z;draw()};
 range.oninput=()=>{z=+range.value;draw()};
 const onRs=()=>{const sc=s0*z,rx=x/sc,ry=y/sc;layout();x=rx*s0*z;y=ry*s0*z;draw()};window.addEventListener('resize',onRs);
 const close=v=>{window.removeEventListener('resize',onRs);ov.classList.add('hidden');ov.innerHTML='';ov.onclick=null;resolve(v)};
 ov.onclick=async e=>{const b=e.target.closest('[data-x]');if(!b)return;const a=b.dataset.x;
  if(a==='cancel')close(null);else if(a==='reset'){z=1;x=0;y=0;range.value=1;draw()}else if(a==='rot')await load(await rotateData(src));
  else if(a==='ok'){const sc=s0*z,il=fx+fw/2-W*sc/2+x,it=fy+fh/2-H*sc/2+y,OW=1280,OH=Math.round(OW/aspect);const c=document.createElement('canvas');c.width=OW;c.height=OH;
   const g=c.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(img,(fx-il)/sc,(fy-it)/sc,fw/sc,fh/sc,0,0,OW,OH);close(c.toDataURL('image/jpeg',.82))}};
 load(src).catch(()=>{toast('Bild konnte nicht geladen werden');close(null)})})}

const SEASONS=['Sommer','Winter','Ganzjahr'];
function dotDate(dot){const m=String(dot||'').replace(/\D/g,'');if(m.length!==4)return null;const w=+m.slice(0,2),y=2000+ +m.slice(2);if(w<1||w>53)return null;return new Date(y,0,1+(w-1)*7)}
const dotAge=dot=>{const d=dotDate(dot);return d?(Date.now()-d)/31557600000:null};
const tyreTreads=t=>[t.tFL,t.tFR,t.tRL,t.tRR].filter(x=>x!=null);
const tyreMin=t=>{const v=tyreTreads(t);return v.length?Math.min(...v):null};
const tyreLimit=t=>t.season==='Sommer'?1.6:4;
function tyreKm(t){const cur=carOdo(t.carId);return(t.kmTotal||0)+(t.mounted&&t.mountedOdo!=null&&cur!=null?Math.max(0,cur-t.mountedOdo):0)}

 const m=tyreMin(t),lim=tyreLimit(t);if(m!=null&&m<lim)w.push({st:'over',t:`Profil ${fmtN(m,1)} mm – unter ${fmtN(lim,1)} mm`});else if(m!=null&&m<lim+1)w.push({st:'soon',t:`Profil ${fmtN(m,1)} mm – bald am Limit (${fmtN(lim,1)} mm)`});return w}

function tyreGeneric(c){if(c.foreign||c.archived)return null;const t=today(),y=t.slice(0,4),md=t.slice(5);let w=null;

 if(!w)return null;if((c.tyreAck||[]).includes(w.k))return null;

 return{kind:'km',id:'km',carId:c.id,label:'km-Stand eintragen',st:'soon',text:d?`zuletzt am ${fmtD(d)} (vor ${days>=60?Math.round(days/30)+' Monaten':Math.round(days/7)+' Wochen'})`:'noch kein km-Stand',score:0}}).filter(Boolean)}

 const d=daysUntil(pts[pts.length-1][0])-daysUntil(pts[0][0]),km=pts[pts.length-1][1]-pts[0][1];return d>=30&&km>0?km/d:null}

  const v=$('video',o);v.srcObject=scanStream;let done=false;const fin=c=>{if(done)return;done=true;stopScan();res(c)};

async function withUndo(name,fn){const snap=structuredClone(Object.fromEntries(STORES.filter(s=>s!=='photos').map(s=>[s,S[s]])));const before=JSON.stringify(snap);
 undoPhotos=[];undoActive=true;try{await fn()}finally{undoActive=false}
 const now=JSON.stringify(Object.fromEntries(STORES.filter(s=>s!=='photos').map(s=>[s,S[s]])));if(now===before&&!undoPhotos.length)return;
 undoData={snap,photos:undoPhotos};undoPhotos=[];showUndo(`${UNDO_LABEL[name]||'Eintrag'} gelöscht`)}
function showUndo(msg){const u=$('#undo');u.innerHTML=`<span>🗑️ ${esc(msg)}</span><button type="button" id="undoBtn">↶ Rückgängig</button><i></i>`;u.classList.remove('show');void u.offsetWidth;u.classList.add('show');

async function doUndo(){const d=undoData;if(!d)return;undoData=null;clearTimeout(undoT);$('#undo').classList.remove('show');
 for(const s of Object.keys(d.snap)){const old=new Map(d.snap[s].map(x=>[x.id,x]));
  for(const x of[...S[s]])if(!old.has(x.id))await del(s,x.id);
  for(const x of d.snap[s]){const cur=S[s].find(y=>y.id===x.id);if(!cur||JSON.stringify(cur)!==JSON.stringify(x))await put(s,x)}}

function readDataURL(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
async function addToolDocs(files){for(const f of files){try{if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)){if(f.size>8e6){toast('PDF ist größer als 8 MB – bitte als Foto aufnehmen');continue}draft.docs.push({id:uid(),type:'pdf',name:f.name,data:await readDataURL(f)})}
 else draft.docs.push({id:uid(),type:'img',name:f.name||'Rechnung',data:await compressImage(f,1800,.8)})}catch(e){toast('Datei konnte nicht gelesen werden')}}renderToolDocs()}
function docFileName(id,fallback){const clean=x=>String(x||'').replace(/\.pdf$/i,'').replace(/[^\wäöüÄÖÜß-]+/g,'_').replace(/^_+|_+$/g,'').slice(0,60);
 const num=(list,base)=>{const pdfs=list.filter(x=>x.type==='pdf');const i=pdfs.findIndex(x=>x.id===id);return pdfs.length>1&&i>=0?base+'_'+(i+1):base};
 for(const e of S.entries){const ps=e.photos||[];if(ps.some(x=>x.id===id))return num(ps,[clean(e.title||e.category),e.date].filter(Boolean).join('_'))+'.pdf'}
 for(const t of S.tools){const ds=t.docs||[];if(ds.some(x=>x.id===id))return num(ds,clean(t.name)+'_Rechnung')+'.pdf'}
 for(const c of S.cars){const ds=c.docs||[];const d=ds.find(x=>x.id===id);if(d)return num(ds.filter(x=>x.kind===d.kind),[clean(dispName(c)),clean(d.kind)].join('_'))+'.pdf'}
 const f=S.fuel.find(x=>x.photoId===id);if(f)return['Tankbeleg',clean(carName(f.carId)),f.date].join('_')+'.pdf';
 return(clean(fallback)||'Dokument')+'.pdf'}
async function openDoc(id,local,name){const data=local||await getPhoto(id);if(!data){toast('Datei nicht gefunden');return}

function generalColor(){const rgb=h=>{const n=parseInt(h.slice(1),16);return[n>>16,n>>8&255,n&255]};const cars=S.cars.map(c=>carColor(c.id)).filter(h=>/^#[0-9a-f]{6}$/i.test(h)).map(rgb);
 const cand=['#a855f7','#3b82f6','#ec4899','#f97316','#14b8a6'];let best=cand[0],bd=-1;
 for(const c of cand){const v=rgb(c);const d=cars.length?Math.min(...cars.map(x=>Math.hypot(x[0]-v[0],x[1]-v[1],x[2]-v[2]))):999;if(d>bd){bd=d;best=c}}return best}

function hexFromHsl(h,s,l){const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1));return'#'+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('')}
async function colorFromPhoto(data){try{const img=await loadImg(data);const W=80,H=45,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');g.drawImage(img,0,0,W,H);const px=g.getImageData(0,0,W,H).data;
 const bins=new Array(24).fill(0).map(()=>({w:0,h:0,s:0,l:0}));let sat=0,neu=0,neuL=0;
 for(let y=Math.floor(H*.2);y<H*.9;y++)for(let x=Math.floor(W*.15);x<W*.85;x++){const i=(y*W+x)*4,r=px[i]/255,gg=px[i+1]/255,b=px[i+2]/255,mx=Math.max(r,gg,b),mn=Math.min(r,gg,b),l=(mx+mn)/2,d=mx-mn;
  const s=d===0?0:d/(1-Math.abs(2*l-1));if(s>.28&&l>.12&&l<.85){let h=mx===r?((gg-b)/d)%6:mx===gg?(b-r)/d+2:(r-gg)/d+4;h=(h*60+360)%360;const bn=bins[Math.floor(h/15)];bn.w+=s;bn.h+=h*s;bn.s+=s*s;bn.l+=l*s;sat+=s}else{neu++;neuL+=l}}
 const total=sat+neu*.35;const best=bins.reduce((a,b)=>b.w>a.w?b:a);
 if(best.w>total*.22){const h=best.h/best.w,s=Math.min(.78,Math.max(.45,best.s/best.w)),l=Math.min(.6,Math.max(.48,best.l/best.w));return hexFromHsl(h,s,l)}
 const L=neu?neuL/neu:.5;return L>.62?'#c3cad5':L<.3?'#8a93a0':'#a7b0bc'}catch(e){return null}}

function niceMax(v){if(v<=0)return 10;const p=Math.pow(10,Math.floor(Math.log10(v))),f=v/p;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}

 const series=new Map();for(const it of items){if(it.noSum||!it.amount)continue;const k=it.date.slice(0,7);if(!keys.includes(k))continue;const s=it.carId||'_';if(!series.has(s))series.set(s,{});series.get(s)[k]=(series.get(s)[k]||0)+it.amount}
 if(!series.size)return'';const ids=[...series.keys()].sort((a,b)=>a==='_'?1:b==='_'?-1:carName(a).localeCompare(carName(b),'de'));
 const max=niceMax(Math.max(...keys.map(k=>Math.max(...ids.map(s=>series.get(s)[k]||0)))));const gc=generalColor(),col=s=>s==='_'?gc:carColor(s);

 <div class="cols">${keys.map(k=>`<div class="col">${ids.map(s=>{const v=series.get(s)[k]||0;return`<i style="height:${v/max*100}%;background:${col(s)}" title="${eur(v)}"></i>`}).join('')}</div>`).join('')}</div></div>

function parseFuelReceipt(raw){
 const text=raw.replace(/\r/g,'');const lines=text.split('\n').map(l=>l.trim()).filter(Boolean);
 const NUM=/(\d{1,4})[,.](\d{1,3})(?!\d)/g;const nums=l=>[...l.matchAll(NUM)].map(m=>({v:parseFloat(m[1]+'.'+m[2]),dec:m[2].length,raw:m[0],i:m.index}));
 const r={liters:null,ppl:null,total:null,date:null,type:null,station:null,unit:'l',raw:text};
 // Gesamtbetrag: Zahlen in Summen-Zeilen, häufigster Wert gewinnt
 const tot={};for(const l of lines){if(/summe|total|bezahlt|betrag|brutto|zu zahlen|gesamt|bar\b|karte|girocard|mastercard|visa|maestro/i.test(l)&&!/netto|mwst|ust|steuer/i.test(l))

 for(const c of S.cars.filter(c=>c.demo&&(c.deadlines||[]).some(d=>d.label==='HU/AU'))){c.deadlines=c.deadlines.filter(d=>!['HU/AU','Kfz-Steuer'].includes(d.label));if(!c.firstReg)c.firstReg=c.make==='Audi'?'2000-03-15':'1996-11-05';try{await put('cars',c)}catch(e){}}
 render();
 ensureCarColors().then(()=>{if(S.cars.some(c=>c.colorAuto!==undefined))render()});
 if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
